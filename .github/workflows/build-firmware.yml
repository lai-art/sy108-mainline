name: build-firmware

# The SY108 images are arm64/musl.  The build tree is driven by the shared
# container in tools/, so the runner has to be able to run an arm64 image.
# GitHub's native arm64 runners match the container platform and avoid the
# qemu emulation that made the previous x86 runs unusably slow.

on:
  push:
    # `wifi-host` is the "SY108 无线网卡版" line: the single USB port runs in
    # host mode and drives an external MT7921AU Wi-Fi adapter, instead of the
    # gadget NCM management port that plain `main` keeps. Both lines build
    # independently - each push only rebuilds its own branch, and artifacts
    # never mix. Releases stay tag-only (see the `release` job), so pushing
    # this branch cannot overwrite a mainline release.
    branches: [main, wifi-host]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Image profile to build'
        required: true
        default: main
        type: choice
        options: [main, recovery, both]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A full firmware build compiles the kernel from source and takes a long
  # time.  Cancelling an in-flight build on every push wastes that work and
  # leaves the branch without an artifact, so only the queued run is replaced.
  cancel-in-progress: false

# Artifact names are part of the product identity. A HOST image and a mainline
# image currently ship the very same inner filenames (sysupgrade.bin,
# boot.bin, ...), so two downloads in one folder silently overwrite each
# other and a mainline device can be flashed with the wrong firmware. Keep
# mainline at `sy108-*` and give the wifi-host line a distinct `SY108-HOST-*`
# prefix. One variable drives both the build and the release job, so a tag
# build cannot end up looking for the other prefix. A tag push has the tag as
# ref_name, so releases keep the mainline `sy108` identity - releases are the
# mainline channel, and tags are only cut on main. Every artifact also ends in
# a BUILD_STAMP (UTC+8, YYYYMMDD-HHMM) from the meta job, so two builds of the
# same line never overwrite each other and the age of an image is obvious.
env:
  ARTIFACT_PREFIX: ${{ github.ref_name == 'wifi-host' && 'SY108-HOST' || 'sy108' }}

jobs:
  # Both profiles must carry the SAME timestamp, and the release job has to
  # reconstruct the exact artifact names. Computing it once here avoids a
  # matrix output race and avoids a main/recovery pair straddling a minute
  # boundary and ending up with different names.
  meta:
    name: build-metadata
    runs-on: ubuntu-latest
    outputs:
      build_stamp: ${{ steps.stamp.outputs.value }}
    steps:
      - name: Build timestamp (UTC+8)
        id: stamp
        run: echo "value=$(date -u -d '+8 hours' +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: build-${{ matrix.profile }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # The arm64 runner exposes four processors; the container limit is
      # clamped to the host capacity anyway, but stating it keeps the make
      # job count and the cgroup quota in step.
      SY108_JOBS: 4
      BUILD_STAMP: ${{ needs.meta.outputs.build_stamp }}
      SY108_MEMORY: 8g
    strategy:
      fail-fast: false
      matrix:
        profile: [main, recovery]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache build tree and downloads
        uses: actions/cache@v4
        with:
          path: |
            out/openwrt-build
            out/downloads
            out/ccache
          # The cache restores the whole build tree, including the incremental
          # package-scan state under tmp/. A stale tree silently drops a package
          # that was just added or changed under packages/: defconfig reuses the
          # old package index, so its CONFIG_PACKAGE_<name>=y line vanishes while
          # the build still turns green (that already shipped twice, runs 52/53).
          # Hash every input that changes the image so a package/config/tool
          # change forces a cache miss (fresh, correct scan). No restore-keys:
          # a prefix fallback could resurrect a tree built from a different
          # package set. tools/bootstrap.py additionally drops the tmp/ scan
          # state as a second line of defence.
          key: sy108-v3-${{ matrix.profile }}-${{ hashFiles('manifests/*.json', 'integration/openwrt/**', 'integration/openwrt/target/linux/sprd/patches-7.3/*.patch', 'packages/**', 'configs/**', 'tools/**') }}

      - name: Prepare builder image
        run: |
          docker build -t sy108-build:25.12.6 containers/

      - name: Drop cached kernel when target patches change
        run: |
          KD=$(ls -d out/openwrt-build/build_dir/target-*/linux-sprd_udx710 2>/dev/null || true)
          [ -n "$KD" ] || { echo "No prepared kernel tree in cache; nothing to drop"; exit 0; }
          want=$(cat integration/openwrt/target/linux/sprd/patches-7.3/*.patch 2>/dev/null | sha256sum | cut -d' ' -f1)
          have=$(cat "$KD/.sy108-patch-hash" 2>/dev/null || true)
          if [ "$want" != "$have" ]; then
            echo "target patches changed ($have -> $want): dropping the prepared kernel tree"
            rm -rf "$KD"
          else
            echo "target patches unchanged: reusing the prepared kernel tree"
          fi

      - name: Bootstrap build tree
        run: |
          python3 tools/bootstrap.py

      - name: Build ${{ matrix.profile }} firmware
        run: |
          set -o pipefail
          python3 tools/build/firmware.py ${{ matrix.profile }} --jobs 4 2>&1 | tee build-${{ matrix.profile }}.log

      # GitHub withholds the runner log for fork repositories (403 even for the
      # owner-less public API), so a compiler error inside the build step is
      # otherwise invisible. Persist the log as an artifact on failure so it can
      # be pulled back for diagnosis.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-build-log-${{ matrix.profile }}-${{ env.BUILD_STAMP }}
          path: build-${{ matrix.profile }}.log
          retention-days: 7
          if-no-files-found: warn

      - name: Record target patch hash
        run: |
          KD=$(ls -d out/openwrt-build/build_dir/target-*/linux-sprd_udx710 2>/dev/null || true)
          [ -n "$KD" ] || exit 0
          cat integration/openwrt/target/linux/sprd/patches-7.3/*.patch 2>/dev/null | sha256sum | cut -d' ' -f1 > "$KD/.sy108-patch-hash"

      - name: Collect artifacts
        run: |
          mkdir -p artifact/${{ matrix.profile }}
          cp -a out/images/${{ matrix.profile }}/. artifact/${{ matrix.profile }}/
          cd artifact/${{ matrix.profile }}
          sha256sum * > SHA256SUMS || true

      # Plain text marker so an extracted artifact is still recognisable
      # after the zip filename is gone. Deliberately NOT appended to
      # SHA256SUMS: that file is generated by the previous step and must stay
      # byte-identical to what the build emitted.
      - name: Mark HOST variant
        if: env.ARTIFACT_PREFIX == 'SY108-HOST'
        run: |
          cat > artifact/${{ matrix.profile }}/SY108-HOST.txt <<EOF
          SY108 HOST variant - wifi-host branch
          USB role : host (external USB Wi-Fi / wired LAN adapters)
          Uplink   : cellular wwan0 only; every USB adapter is a LAN port
          Artifact : ${{ env.ARTIFACT_PREFIX }}-${{ matrix.profile }}-${{ env.BUILD_STAMP }}
          Built    : ${{ env.BUILD_STAMP }} (UTC+8, YYYYMMDD-HHMM)
          Commit   : ${{ github.sha }}
          Run      : ${{ github.run_number }}

          Inner filenames stay standard (sysupgrade.bin, boot.bin, ...) so
          SHA256SUMS and the flash tooling keep working. The zip and this
          marker are what distinguish this image from a mainline build.
          EOF

      # A stale build-tree cache can silently drop a package that was just
      # added under packages/: defconfig reuses the old package index, so the
      # new CONFIG_PACKAGE_<name>=y line vanishes while the build still turns
      # green. That already shipped twice (run 52/53). Refuse to publish an
      # image whose openwrt.config is missing any package the profile asks for.
      - name: Verify requested packages survived defconfig
        run: |
          src="configs/openwrt-${{ matrix.profile }}.config"
          built="artifact/${{ matrix.profile }}/openwrt.config"
          [ -f "$built" ] || { echo "::error::$built missing"; exit 1; }
          fail=0
          while IFS= read -r line; do
            case "$line" in
              CONFIG_PACKAGE_*=y)
                sym="${line%%=*}"
                grep -qx "${sym}=y" "$built" || {
                  echo "::error::$sym requested in $src but missing from built config"
                  fail=1
                }
                ;;
            esac
          done < "$src"
          exit $fail

      # 002-sy108-usb3-lpm-disable.patch has to reach the compiled DTB, and a
      # stale build tree or a cached kernel drops it silently - the image still
      # boots and still trains SuperSpeed, only the link keeps falling into
      # U1/U2.  That failure mode is indistinguishable from a cable problem
      # until the image is flashed, so refuse to publish an image without it.
      - name: Verify device tree invariants (USB3 LPM + fixed USB role)
        run: |
          dtb=artifact/${{ matrix.profile }}/board.dtb
          if [ ! -f "$dtb" ]; then
            echo "::error::board.dtb missing from ${{ matrix.profile }} artifacts"
            exit 1
          fi
          for prop in snps,dis-u1-entry-quirk snps,dis-u2-entry-quirk; do
            if ! grep -aq -- "$prop" "$dtb"; then
              echo "::error::$prop missing from $dtb - 002-sy108-usb3-lpm-disable.patch was not applied"
              exit 1
            fi
          done
          if grep -aq -- 'snps,usb3-u1u2-disable' "$dtb"; then
            echo "::error::dead property snps,usb3-u1u2-disable still present in $dtb - 002 not applied"
            exit 1
          fi
          # The USB role must be FIXED on both images, never switchable. A
          # stale cached kernel tree can retain a .patch that was deleted from
          # the repository, and dr_mode="otg" makes dwc3 take dwc3_drd_init()
          # instead of host/gadget init. Run 50 shipped exactly this failure
          # with a green build, so refuse to publish such an image.
          for prop in usb-role-switch role-switch-default-mode otg; do
            if grep -aq -- "$prop" "$dtb"; then
              echo "::error::$prop present in $dtb - stale/cached kernel tree or unintended USB role switch"
              exit 1
            fi
          done
          # Derive the expected role from the tree instead of hard-coding it per
          # branch, so this same workflow file stays valid on both lines:
          #   recovery   -> always the shared-dtsi default (wired NCM port)
          #   main       -> host when 900-usb-host.patch is present, otherwise
          #                 the plain mainline gadget role
          # Hard-coding "main => host" would fail on the mainline branch, which
          # deliberately does not carry the Wi-Fi changes.
          want=peripheral
          if [ "${{ matrix.profile }}" = "main" ] && \
             [ -f integration/openwrt/target/linux/sprd/patches-7.3/900-usb-host.patch ]; then
            want=host
          fi
          # Parse the FDT instead of grepping for the bare string. The parser
          # names the node that carries dr_mode, and it also proves the packaged
          # board.dtb belongs to this profile by checking /chosen boot-target.
          # `strings | grep -qx` passes on a swapped dtb and prints nothing when
          # the property is absent at all - run 62 failed there with no clue
          # which of the two had happened.
          python3 tools/check/dt-role.py \
            --profile '${{ matrix.profile }}' --expect "$want" "$dtb"
          echo "USB3 LPM quirks present and fixed-${want} role verified in $dtb"

      - name: Upload ${{ matrix.profile }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.profile }}-${{ env.BUILD_STAMP }}
          path: artifact/${{ matrix.profile }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: publish-release
    needs: [meta, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      BUILD_STAMP: ${{ needs.meta.outputs.build_stamp }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      # Both profiles emit boot.bin, build.json and SHA256SUMS.  Uploading them
      # under the same names makes the second one overwrite the first, which
      # already shipped a recovery capsule as the main boot.bin.  Rename the
      # recovery copies before publishing.
      - name: Disambiguate profile assets
        run: |
          mv artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/boot.bin artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/boot-recovery.bin
          mv artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/build.json artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/build-recovery.json
          mv artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/SHA256SUMS artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/SHA256SUMS-recovery

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/${{ env.ARTIFACT_PREFIX }}-main-${{ env.BUILD_STAMP }}/sysupgrade.bin
            artifact/${{ env.ARTIFACT_PREFIX }}-main-${{ env.BUILD_STAMP }}/boot.bin
            artifact/${{ env.ARTIFACT_PREFIX }}-main-${{ env.BUILD_STAMP }}/rootfs.squashfs
            artifact/${{ env.ARTIFACT_PREFIX }}-main-${{ env.BUILD_STAMP }}/build.json
            artifact/${{ env.ARTIFACT_PREFIX }}-main-${{ env.BUILD_STAMP }}/SHA256SUMS
            artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/boot-recovery.bin
            artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/rootfs.cpio.gz
            artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/build-recovery.json
            artifact/${{ env.ARTIFACT_PREFIX }}-recovery-${{ env.BUILD_STAMP }}/SHA256SUMS-recovery
          fail_on_unmatched_files: true
          body: |
            SY108 firmware.

            Artifact prefix `${{ env.ARTIFACT_PREFIX }}`: `sy108` = mainline,
            `SY108-HOST` = host-mode wireless/LAN line. Build stamp
            `${{ env.BUILD_STAMP }}` (UTC+8, YYYYMMDD-HHMM) is part of every
            artifact name. Inner filenames are identical between the two, so
            keep their downloads in separate folders and check
            `SY108-HOST.txt` before flashing.

            * `sysupgrade.bin` - flash this from LuCI under System -> Maintenance,
              or with `sysupgrade -n /tmp/sysupgrade.bin` over SSH.
            * `boot.bin` / `rootfs.squashfs` - raw image parts for the U-Boot
              capsule flow (main profile).
            * `boot-recovery.bin` / `rootfs.cpio.gz` - recovery profile capsule.
            * `SHA256SUMS` - checksums for the main profile; `SHA256SUMS-recovery`
              covers the recovery profile.
