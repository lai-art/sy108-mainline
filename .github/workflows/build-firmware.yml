name: build-firmware

# The SY108 images are arm64/musl.  The build tree is driven by the shared
# container in tools/, so the runner has to be able to run an arm64 image.
# GitHub's native arm64 runners match the container platform and avoid the
# qemu emulation that made the previous x86 runs unusably slow.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Image profile to build'
        required: true
        default: main
        type: choice
        options: [main, recovery, both]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A full firmware build compiles the kernel from source and takes a long
  # time.  Cancelling an in-flight build on every push wastes that work and
  # leaves the branch without an artifact, so only the queued run is replaced.
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.profile }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      # The arm64 runner exposes four processors; the container limit is
      # clamped to the host capacity anyway, but stating it keeps the make
      # job count and the cgroup quota in step.
      SY108_JOBS: 4
      SY108_MEMORY: 8g
    strategy:
      fail-fast: false
      matrix:
        profile: [main, recovery]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache build tree and downloads
        uses: actions/cache@v4
        with:
          path: |
            out/openwrt-build
            out/downloads
            out/ccache
          # Bump the key prefix whenever the prepared kernel tree must be
          # rebuilt from scratch. A .patch deleted from the repo can survive in
          # a restored tree; hashFiles alone does not guarantee re-prepare.
          key: sy108-v2-${{ matrix.profile }}-${{ hashFiles('manifests/*.json', 'integration/openwrt/**', 'integration/openwrt/target/linux/sprd/patches-7.3/*.patch') }}
          restore-keys: |
            sy108-v2-${{ matrix.profile }}-

      - name: Prepare builder image
        run: |
          docker build -t sy108-build:25.12.5 containers/

      - name: Drop cached kernel when target patches change
        run: |
          KD=$(ls -d out/openwrt-build/build_dir/target-*/linux-sprd_udx710 2>/dev/null || true)
          [ -n "$KD" ] || { echo "No prepared kernel tree in cache; nothing to drop"; exit 0; }
          want=$(cat integration/openwrt/target/linux/sprd/patches-7.3/*.patch 2>/dev/null | sha256sum | cut -d' ' -f1)
          have=$(cat "$KD/.sy108-patch-hash" 2>/dev/null || true)
          if [ "$want" != "$have" ]; then
            echo "target patches changed ($have -> $want): dropping the prepared kernel tree"
            rm -rf "$KD"
          else
            echo "target patches unchanged: reusing the prepared kernel tree"
          fi

      - name: Bootstrap build tree
        run: |
          python3 tools/bootstrap.py

      - name: Build ${{ matrix.profile }} firmware
        run: |
          python3 tools/build/firmware.py ${{ matrix.profile }} --jobs 4

      - name: Record target patch hash
        run: |
          KD=$(ls -d out/openwrt-build/build_dir/target-*/linux-sprd_udx710 2>/dev/null || true)
          [ -n "$KD" ] || exit 0
          cat integration/openwrt/target/linux/sprd/patches-7.3/*.patch 2>/dev/null | sha256sum | cut -d' ' -f1 > "$KD/.sy108-patch-hash"

      - name: Collect artifacts
        run: |
          mkdir -p artifact/${{ matrix.profile }}
          cp -a out/images/${{ matrix.profile }}/. artifact/${{ matrix.profile }}/
          cd artifact/${{ matrix.profile }}
          sha256sum * > SHA256SUMS || true

      # 002-sy108-usb3-lpm-disable.patch has to reach the compiled DTB, and a
      # stale build tree or a cached kernel drops it silently - the image still
      # boots and still trains SuperSpeed, only the link keeps falling into
      # U1/U2.  That failure mode is indistinguishable from a cable problem
      # until the image is flashed, so refuse to publish an image without it.
      - name: Verify device tree invariants (USB3 LPM + fixed peripheral role)
        run: |
          dtb=artifact/${{ matrix.profile }}/board.dtb
          if [ ! -f "$dtb" ]; then
            echo "::error::board.dtb missing from ${{ matrix.profile }} artifacts"
            exit 1
          fi
          for prop in snps,dis-u1-entry-quirk snps,dis-u2-entry-quirk; do
            if ! grep -aq -- "$prop" "$dtb"; then
              echo "::error::$prop missing from $dtb - 002-sy108-usb3-lpm-disable.patch was not applied"
              exit 1
            fi
          done
          if grep -aq -- 'snps,usb3-u1u2-disable' "$dtb"; then
            echo "::error::dead property snps,usb3-u1u2-disable still present in $dtb - 002 not applied"
            exit 1
          fi
          # The management port must stay a FIXED USB device. A cached kernel
          # tree can retain a .patch that was deleted from the repository, and
          # dr_mode="otg" makes dwc3 take dwc3_drd_init() instead of
          # dwc3_gadget_init(); boot_accept() then never sees the UDC and the
          # watchdog returns to Recovery. Run 50 shipped exactly this failure
          # with a green build, so refuse to publish such an image.
          for prop in usb-role-switch role-switch-default-mode otg; do
            if grep -aq -- "$prop" "$dtb"; then
              echo "::error::$prop present in $dtb - stale/cached kernel tree or unintended USB role switch"
              exit 1
            fi
          done
          if ! grep -aq -- 'peripheral' "$dtb"; then
            echo "::error::dr_mode is not peripheral in $dtb"
            exit 1
          fi
          echo "USB3 LPM quirks present and fixed-peripheral role verified in $dtb"

      - name: Upload ${{ matrix.profile }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sy108-${{ matrix.profile }}
          path: artifact/${{ matrix.profile }}
          retention-days: 30
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      # Both profiles emit boot.bin, build.json and SHA256SUMS.  Uploading them
      # under the same names makes the second one overwrite the first, which
      # already shipped a recovery capsule as the main boot.bin.  Rename the
      # recovery copies before publishing.
      - name: Disambiguate profile assets
        run: |
          mv artifact/sy108-recovery/boot.bin artifact/sy108-recovery/boot-recovery.bin
          mv artifact/sy108-recovery/build.json artifact/sy108-recovery/build-recovery.json
          mv artifact/sy108-recovery/SHA256SUMS artifact/sy108-recovery/SHA256SUMS-recovery

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/sy108-main/sysupgrade.bin
            artifact/sy108-main/boot.bin
            artifact/sy108-main/rootfs.squashfs
            artifact/sy108-main/build.json
            artifact/sy108-main/SHA256SUMS
            artifact/sy108-recovery/boot-recovery.bin
            artifact/sy108-recovery/rootfs.cpio.gz
            artifact/sy108-recovery/build-recovery.json
            artifact/sy108-recovery/SHA256SUMS-recovery
          fail_on_unmatched_files: true
          body: |
            SY108 mainline firmware.

            * `sysupgrade.bin` - flash this from LuCI under System -> Maintenance,
              or with `sysupgrade -n /tmp/sysupgrade.bin` over SSH.
            * `boot.bin` / `rootfs.squashfs` - raw image parts for the U-Boot
              capsule flow (main profile).
            * `boot-recovery.bin` / `rootfs.cpio.gz` - recovery profile capsule.
            * `SHA256SUMS` - checksums for the main profile; `SHA256SUMS-recovery`
              covers the recovery profile.
